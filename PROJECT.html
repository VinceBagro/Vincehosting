<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vince Hosting</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: #000;
      color: #0ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 2.5em;
      text-shadow: 0 0 10px #0ff;
    }
    .plans, .form, .payment {
      margin-top: 30px;
      display: none;
      flex-direction: column;
      align-items: center;
    }
    .plan-btn, button {
      padding: 10px 25px;
      margin: 10px;
      background: #0ff;
      color: #000;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    input[type="text"], input[type="file"] {
      width: 90%;
      max-width: 400px;
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
    }
    .form label {
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>Welcome to Vince Hosting</h1>

<div class="plans" id="plans" style="display:flex;">
  <button class="plan-btn" onclick="selectPlan('100')">100 pesos</button>
  <button class="plan-btn" onclick="selectPlan('400')">400 pesos</button>
</div>

<div class="payment" id="paymentSection">
  <p id="payInfo"></p>
  <button onclick="showForm()">Accept</button>
</div>

<div class="form" id="formSection">
  <input type="text" id="tgUsername" placeholder="Telegram Username">
  <input type="text" id="realName" placeholder="Real Name">
  <input type="text" id="plan" readonly>
  <input type="text" id="price" readonly>

  <label>Upload Receipt (image):</label>
  <input type="file" id="receiptPic" accept="image/*">

  <label>Upload Hosting File:</label>
  <input type="file" id="hostingFile">

  <label>Upload Database (zip only):</label>
  <input type="file" id="dbFile" accept=".zip">

  <button onclick="sendToBot()">Send All Files</button>
</div>

<!-- Keep everything else above the same -->

<!-- Replace the sendToBot function with this updated one -->
<script>
  let selectedPlan = '';

  function selectPlan(amount) {
    selectedPlan = amount;
    document.getElementById('plans').style.display = 'none';
    document.getElementById('paymentSection').style.display = 'flex';
    document.getElementById('payInfo').innerHTML = `
      Please send <strong>${amount} pesos</strong> to <br>
      <strong>09266386351 - Rb</strong><br><br>
      Then message your receipt to <strong>@VINZZLW</strong><br><br>
      Click "Accept" to continue.`;
    document.getElementById('plan').value = `Plan ${amount}`;
    document.getElementById('price').value = `${amount} pesos`;
  }

  function showForm() {
    document.getElementById('paymentSection').style.display = 'none';
    document.getElementById('formSection').style.display = 'flex';
  }

  async function sendToBot() {
    const sendBtn = document.querySelector('button[onclick="sendToBot()"]');
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending...";

    const tgUsername = document.getElementById('tgUsername').value.trim();
    const realName = document.getElementById('realName').value.trim();
    const plan = document.getElementById('plan').value.trim();
    const price = document.getElementById('price').value.trim();
    const receiptPic = document.getElementById('receiptPic').files[0];
    const hostingFile = document.getElementById('hostingFile').files[0];
    const dbFile = document.getElementById('dbFile').files[0];

    if (!tgUsername || !realName || !plan || !price || !receiptPic || !hostingFile || !dbFile) {
      alert("Please fill out all fields and upload all files.");
      sendBtn.disabled = false;
      sendBtn.textContent = "Send All Files";
      return;
    }

    const token = '8148059407:AAEkEwRZh36c3sgk1XrsGfZbScqqINw9wsw';
    const chatId = '7141864085';

    try {
      const message = `NEW HOSTING REQUEST:\n\nUsername: @${tgUsername}\nName: ${realName}\nPlan: ${plan}\nPrice: ${price}`;
      await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, text: message })
      });

      await uploadFile(receiptPic, token, chatId);
      await uploadFile(hostingFile, token, chatId);
      await uploadFile(dbFile, token, chatId);

      alert("Done!\n\nPlease wait to get hosting. Your bot will automatically host once the owner receives it.");

      const confirmChat = confirm("Do you want to chat the owner now?");
      if (confirmChat) {
        window.location.href = 'https://t.me/VINZZLW';
      }
    } catch (err) {
      alert("Failed to send file. Redirecting you to the owner...");
      window.location.href = 'https://t.me/VINZZLW';
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = "Send All Files";
    }
  }

  async function uploadFile(file, token, chatId) {
    const formData = new FormData();
    formData.append('chat_id', chatId);
    formData.append('document', file);
    const response = await fetch(`https://api.telegram.org/bot${token}/sendDocument`, {
      method: 'POST',
      body: formData
    });
    if (!response.ok) throw new Error("Upload failed");
  }
</script>
</body>
</html>
